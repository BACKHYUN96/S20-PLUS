name: Pixel Traffic Unity

# Run validated main changes on the connected PC; no pull-request trigger.
on:
  push:
    branches: [main]
    tags: ['unity-apk-*']
    paths:
      - 'pixel-traffic-unity/**'
      - '.github/workflows/pixel-traffic-unity.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Unity operation (APK is a separate Activity prototype)
        required: true
        type: choice
        default: Validate
        options:
          - Validate
          - BuildApk

permissions:
  contents: read

concurrency:
  group: pixel-traffic-unity
  cancel-in-progress: false

jobs:
  unity:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/unity-apk-')
    # Later, point this variable to a provisioned Windows/Linux cloud runner.
    runs-on: ${{ fromJSON(vars.PIXEL_TRAFFIC_RUNNER_LABELS || '["self-hosted","Windows","X64","pixel-traffic-unity"]') }}
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ vars.PIXEL_TRAFFIC_RUNNER_SHELL || 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"' }}
    steps:
      - name: Preserve a failed build log for redacted diagnosis
        run: |
          $ErrorActionPreference = 'Stop'
          $previousReport = './pixel-traffic-unity/Reports/pipeline-result.json'
          if (Test-Path -LiteralPath $previousReport) {
            $previous = Get-Content -LiteralPath $previousReport -Raw | ConvertFrom-Json
            if ($previous.operation -eq 'BuildApk' -and $previous.result -eq 'FAILED') {
              $log = './pixel-traffic-unity/Reports/unity-BuildApk.log'
              if (Test-Path -LiteralPath $log) {
                Copy-Item -LiteralPath $log -Destination (Join-Path $env:RUNNER_TEMP 'pixel-traffic-prior-build.log')
              }
            }
          }
      - uses: actions/checkout@v4
      - name: Extract errors from the previous build without sharing the raw log
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'pixel-traffic-prior-build.log'
          if (Test-Path -LiteralPath $log) {
            New-Item -ItemType Directory './pixel-traffic-unity/Reports' -Force | Out-Null
            try {
              ./pixel-traffic-unity/tools/collect-build-failure.ps1 -LogPath $log -OutputPath './pixel-traffic-unity/Reports/prior-build-failure.json'
            } finally { Remove-Item -LiteralPath $log -Force }
          }
      - name: Require APK tag to point to the current main
        if: startsWith(github.ref, 'refs/tags/unity-apk-')
        run: |
          $ErrorActionPreference = 'Stop'
          git -c "safe.directory=$env:GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin main
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the main revision.' }
          $headCommit = git -c "safe.directory=$env:GITHUB_WORKSPACE" rev-parse HEAD
          $mainCommit = git -c "safe.directory=$env:GITHUB_WORKSPACE" rev-parse FETCH_HEAD
          if ($headCommit -ne $mainCommit) { throw 'APK tags must point to current main; build stopped.' }
      - name: Validate or build with the shared entry point
        env:
          UNITY_EDITOR_PATH: ${{ vars.UNITY_EDITOR_PATH }}
          UNITY_ANDROID_SDK_PATH: ${{ vars.UNITY_ANDROID_SDK_PATH }}
          PIXEL_TRAFFIC_OPERATION: ${{ inputs.operation || (startsWith(github.ref, 'refs/tags/unity-apk-') && 'BuildApk' || 'Validate') }}
          PIXEL_TRAFFIC_KEYSTORE_BASE64: ${{ secrets.PIXEL_TRAFFIC_KEYSTORE_BASE64 }}
          PIXEL_TRAFFIC_KEYSTORE_PASSWORD: ${{ secrets.PIXEL_TRAFFIC_KEYSTORE_PASSWORD }}
          PIXEL_TRAFFIC_KEY_PASSWORD: ${{ secrets.PIXEL_TRAFFIC_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in Get-ChildItem './pixel-traffic-unity/tools/*.ps1') {
            $tokens = $null; $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw "PowerShell syntax errors in $($script.Name): $parseErrors" }
          }
          ./pixel-traffic-unity/tools/run-pipeline.ps1 -Operation $env:PIXEL_TRAFFIC_OPERATION
      - name: Upload reports (raw Editor logs and credentials stay out of artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-reports-${{ github.run_id }}
          path: |
            pixel-traffic-unity/Reports/pipeline-result.json
            pixel-traffic-unity/Reports/scene-validation.json
            pixel-traffic-unity/Reports/apk-verification.json
            pixel-traffic-unity/Reports/android-build-result.txt
            pixel-traffic-unity/Reports/android-lint-result.json
            pixel-traffic-unity/Reports/prior-build-failure.json
            pixel-traffic-unity/Reports/verification-failure.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload verified Activity APK
        if: success() && (inputs.operation == 'BuildApk' || startsWith(github.ref, 'refs/tags/unity-apk-'))
        uses: actions/upload-artifact@v4
        with:
          name: unity-activity-apk-${{ github.run_id }}
          path: pixel-traffic-unity/Builds/pixel-traffic-unity-prototype-0.1.0.apk
          if-no-files-found: error
          retention-days: 7
